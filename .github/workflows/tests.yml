name: Unit tests
on:
  push:
  pull_request:
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q aerocarreira
      - name: Tests
        run: python -m unittest discover -s tests -v
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright pillow airportsdata
      - run: python -m playwright install --with-deps chromium
      - run: xvfb-run -a python scripts/verify_dashboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midnight-dashboard-validation
          path: validation/
