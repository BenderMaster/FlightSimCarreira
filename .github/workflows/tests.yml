name: Unit tests
on:
  push:
  pull_request:
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q aerocarreira
      - name: Tests
        run: python -m unittest discover -s tests -v
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright pillow airportsdata
      - run: python -m playwright install --with-deps chromium
      - run: xvfb-run -a python scripts/verify_dashboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midnight-dashboard-validation
          path: validation/
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-windows.txt pyinstaller
      - name: Build standalone Windows folder
        run: python -m PyInstaller --noconfirm --clean --onedir --name FlightSimCarreira --collect-all webview --collect-all SimConnect --collect-all airportsdata --add-data "aerocarreira/midnight;aerocarreira/midnight" --add-data "in_game;in_game" launch_midnight.py
      - name: Validate packaged airport catalog and UI assets
        run: python -c "from pathlib import Path; p=Path('dist/FlightSimCarreira/_internal'); assert any((p/'airportsdata').rglob('*.csv')), 'Airport data missing'; assert (p/'aerocarreira/midnight/index.html').is_file(); assert (p/'aerocarreira/midnight/google-map.js').is_file(); assert (p/'SimConnect/SimConnect.dll').is_file()"
      - name: Executable version smoke test
        run: .\dist\FlightSimCarreira\FlightSimCarreira.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: FlightSimCarreira-0.7.1-midnight-alpha1-Windows
          path: dist/FlightSimCarreira/
