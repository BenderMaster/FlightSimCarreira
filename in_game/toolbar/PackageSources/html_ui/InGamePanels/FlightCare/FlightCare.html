<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="stylesheet" href="/SCSS/common.css">
<script src="/JS/coherent.js"></script>
<script src="/JS/common.js"></script>
<script src="/JS/Services/ToolBarPanels.js"></script>
<script src="/Pages/VCockpit/Instruments/Shared/BaseInstrument.js"></script>
<link rel="import" href="/templates/ingameUi/ingameUi.html">
<link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html">
<style>
/* MSFS 2020 owns the draggable title bar and outer resize handles.
   Do not use content-fit: the inner wrapper can collapse to content height.
   Keep the iframe entirely below the simulator titlebar. */
html,body,ingamepanel-flightcare { height:100%; width:100%; margin:0; overflow:hidden; }
ingamepanel-flightcare { display:block; }
ingame-ui#FlightSimCarreira { display:flex; flex-direction:column; width:100%; height:100%; min-height:0; }
ingame-ui#FlightSimCarreira .ingameUiWrapper,
ingame-ui#FlightSimCarreira .ingameUiContent {
  display:flex; flex-direction:column; flex:1 1 auto; width:100%;
  min-height:0; overflow:hidden;
}
/* Let the simulator receive pointer events on its own draggable header. */
ingame-ui#FlightSimCarreira ingame-ui-header { pointer-events:auto; }
#flightSimContent { display:flex; flex-direction:column; width:100%; height:100%; min-height:0; overflow:hidden; background:#07111c; }
#flightSimFrame { flex:1 1 auto; display:block; width:100%; height:100%; min-height:0; border:0; background:#07111c; }
</style>
<script src="FlightCare.js"></script>
</head>
<body class="border-box">
<ingamepanel-flightcare>
  <ingame-ui id="FlightSimCarreira" panel-id="PANEL_FLIGHTSIMCARREIRA"
             title="FlightSim • InGame" class="ingameUiFrame panelInvisible"
             min-width="480" min-height="360">
    <div id="flightSimContent">
      <iframe id="flightSimFrame" title="FlightSim InGame • somente leitura"
              src="http://127.0.0.1:8769/"></iframe>
    </div>
  </ingame-ui>
</ingamepanel-flightcare>
</body>
</html>
